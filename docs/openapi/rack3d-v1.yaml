openapi: 3.1.0
info:
  title: Rack3D Visualization API
  version: 1.0.0
  summary: Rack3D 전산실, 3D scene, telemetry 및 장애 처리 API
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Rack3D 웹 UI에 실제 inventory, telemetry, incident 데이터를 공급하는 MVP 계약이다.
    모든 시간은 UTC RFC 3339, JSON 필드는 camelCase를 사용한다.
    측정할 수 없는 telemetry는 0이 아니라 null이다.
servers:
  - url: https://api.example.com/api/rack3d/v1
    description: Data API production example
  - url: http://localhost:8080/api/rack3d/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: 로그인, token 회전, 로그아웃 및 현재 사용자 확인
  - name: Data centers
    description: 접근 가능한 전산실 목록과 요약
  - name: Scene
    description: 3D 랙 및 서버 배치 inventory
  - name: Dashboard
    description: 전산실 KPI와 히트맵 집계
  - name: Assets
    description: 전산실 내 랙 및 서버 검색
  - name: Servers
    description: 서버 자산 및 상세 telemetry
  - name: Incidents
    description: 장애 조회와 운영 처리

paths:
  /api/v1/auth/login:
    post:
      servers:
        - url: https://api.example.com
          description: Authentication API production example
        - url: http://localhost:8080
          description: Authentication API local development
      tags: [Authentication]
      operationId: login
      summary: 로그인
      description: |
        사용자 자격 증명을 검증한다. access token은 JSON으로 반환하고 refresh token은
        HttpOnly, Secure, SameSite=Lax 쿠키로만 설정한다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              default:
                value:
                  username: noc.operator
                  password: user-entered-secret
      responses:
        '200':
          description: 로그인 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshSetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              examples:
                default:
                  $ref: '#/components/examples/AuthSessionResponseExample'
        '400':
          $ref: '#/components/responses/AuthBadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/refresh:
    post:
      servers:
        - url: https://api.example.com
          description: Authentication API production example
        - url: http://localhost:8080
          description: Authentication API local development
      tags: [Authentication]
      operationId: refreshAccessToken
      summary: access token 재발급
      description: |
        refresh 쿠키를 검증하고 새 access token을 발급한다. 성공할 때마다 refresh token을
        회전하고 이전 token을 폐기한다. 회전된 token 재사용 시 token family 전체를 폐기한다.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: 재발급 및 refresh rotation 성공
          headers:
            Set-Cookie:
              $ref: '#/components/headers/RefreshSetCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
              examples:
                default:
                  $ref: '#/components/examples/AuthSessionResponseExample'
        '401':
          $ref: '#/components/responses/RefreshUnauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/auth/logout:
    post:
      servers:
        - url: https://api.example.com
          description: Authentication API production example
        - url: http://localhost:8080
          description: Authentication API local development
      tags: [Authentication]
      operationId: logout
      summary: 로그아웃
      description: refresh session을 폐기하고 쿠키를 삭제한다. body는 없다.
      security:
        - bearerAuth: []
          refreshCookie: []
      responses:
        '204':
          description: 로그아웃 완료 또는 이미 폐기된 session
          headers:
            Set-Cookie:
              $ref: '#/components/headers/ClearRefreshCookie'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/me:
    get:
      servers:
        - url: https://api.example.com
          description: Authentication API production example
        - url: http://localhost:8080
          description: Authentication API local development
      tags: [Authentication]
      operationId: getCurrentUser
      summary: 현재 사용자 조회
      description: |
        access token 사용자와 서버가 계산한 최신 역할/권한을 반환한다.
        사용자 인증 상태 응답이므로 Cache-Control: no-store이며 ETag/304를 사용하지 않는다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 현재 사용자와 권한
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
              examples:
                default:
                  value:
                    data:
                      id: user-42
                      username: noc.operator
                      displayName: NOC 운영자
                      roles: [nocOperator]
                      permissions:
                        - dataCenter:read
                        - server:read
                        - incident:read
                        - incident:write
                    meta:
                      requestId: req_me_01
                      generatedAt: '2026-07-28T02:14:05Z'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /data-centers:
    get:
      tags: [Data centers]
      operationId: listDataCenters
      summary: 전산실 목록 조회
      description: 접근 가능한 전산실과 카드 표시용 요약을 반환한다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DataCenterStatus'
        - name: q
          in: query
          description: 코드, 이름, 위치 부분 검색. 전달할 경우 trim 후 2~100자.
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 전산실 목록
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataCenterListResponse'
              examples:
                default:
                  value:
                    data:
                      - id: seoul-main
                        code: SEL-01
                        name: 서울 메인 전산실
                        location: 서울특별시 강남구
                        description: 핵심 서비스와 데이터베이스 인프라를 운영합니다.
                        status: attention
                        rackCount: 4
                        serverCount: 10
                        activeIncidentCount: 3
                        averageAmbientTemperatureCelsius: 21.4
                        telemetryCollectedAt: '2026-07-28T02:14:00Z'
                        telemetryStale: false
                    meta:
                      requestId: req_dc_list_01
                      generatedAt: '2026-07-28T02:14:05Z'
                      page: 1
                      pageSize: 20
                      totalItems: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /data-centers/{dataCenterId}/scene:
    get:
      tags: [Scene]
      operationId: getDataCenterScene
      summary: 전산실 3D scene 조회
      description: 3D 배치, 랙별 집계, 서버 장착 위치와 경량 상태를 반환한다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DataCenterId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 3D scene snapshot
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneResponse'
              examples:
                abridged:
                  summary: 랙 4개 중 A-02만 표시한 문서용 축약 예시
                  description: 실제 wire 응답은 rackCount와 같은 개수의 전체 racks를 포함한다.
                  value:
                    data:
                      dataCenter:
                        id: seoul-main
                        code: SEL-01
                        name: 서울 메인 전산실
                      rackCount: 4
                      sceneVersion: 17
                      inventoryCollectedAt: '2026-07-28T02:13:40Z'
                      inventoryStale: false
                      grid:
                        columns: 12
                        rows: 14
                        tileSizeMeters: 0.6
                      racks:
                        - id: rack-a02
                          label: A-02
                          totalUnits: 42
                          gridX: 7
                          gridZ: 4
                          rotationDegrees: 0
                          summary:
                            serverCount: 3
                            usedUnits: 4
                            availableUnits: 38
                            occupancyPercent: 9.5
                            activeIncidentCount: 1
                            statusCounts:
                              healthy: 2
                              warning: 0
                              critical: 1
                              offline: 0
                          servers:
                            - id: srv-004
                              name: Web 01
                              modelCode: hpe-proliant-dl360-gen11
                              startU: 1
                              units: 1
                              status: healthy
                            - id: srv-005
                              name: Web 02
                              modelCode: hpe-proliant-dl360-gen11
                              startU: 3
                              units: 1
                              status: critical
                            - id: srv-006
                              name: Compute 01
                              modelCode: dell-poweredge-r760
                              startU: 8
                              units: 2
                              status: healthy
                    meta:
                      requestId: req_scene_01
                      generatedAt: '2026-07-28T02:14:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /data-centers/{dataCenterId}/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDataCenterDashboard
      summary: 전산실 대시보드 조회
      description: KPI, 차트와 3D 히트맵용 계산 완료 집계를 반환한다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DataCenterId'
        - name: historyHours
          in: query
          description: MVP에서는 24만 허용한다.
          schema:
            type: integer
            const: 24
            default: 24
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 대시보드 snapshot
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
              examples:
                default:
                  value:
                    data:
                      dataCenterId: seoul-main
                      snapshotAt: '2026-07-28T02:14:00Z'
                      capacity:
                        totalUnits: 42
                        usedUnits: 4
                        availableUnits: 38
                        occupancyPercent: 9.5
                      servers:
                        totalCount: 3
                        healthyPercent: 66.7
                        statusCounts:
                          healthy: 2
                          warning: 0
                          critical: 1
                          offline: 0
                        modelCounts:
                          dell-poweredge-r760: 1
                          hpe-proliant-dl360-gen11: 2
                          cisco-ucs-c240-m7: 0
                      activeIncidentCount: 1
                      temperatureHistory:
                        - bucketAt: '2026-07-28T01:00:00Z'
                          roomAverageCelsius: 21.2
                          rackCelsius:
                            rack-a02: 21.2
                          sampleCount: 1
                      rackMetrics:
                        - rackId: rack-a02
                          rackLabel: A-02
                          serverCount: 3
                          usedUnits: 4
                          availableUnits: 38
                          largestFreeBlockUnits: 34
                          occupancyPercent: 9.5
                          activeIncidentCount: 1
                          maxServerTemperatureCelsius: 72
                          powerWatts: 852
                          networkMbps: 2608
                          incidentDensityPercent: 33.3
                          telemetrySampleCount: 3
                          telemetryCollectedAt: '2026-07-28T02:14:00Z'
                          telemetryStale: false
                    meta:
                      requestId: req_dashboard_01
                      generatedAt: '2026-07-28T02:14:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /data-centers/{dataCenterId}/incidents:
    get:
      tags: [Incidents]
      operationId: listDataCenterIncidents
      summary: 전산실 장애 목록 조회
      description: 기본적으로 open과 acknowledged 장애를 심각도 순으로 반환한다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DataCenterId'
        - name: status
          in: query
          description: CSV. 기본값은 open,acknowledged.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentStatus'
            default: [open, acknowledged]
        - name: severity
          in: query
          description: CSV 심각도 필터.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/IncidentSeverity'
        - name: rackId
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 장애 목록
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentListResponse'
              examples:
                default:
                  value:
                    data:
                      - id: inc-20260728-005
                        dataCenter:
                          id: seoul-main
                          code: SEL-01
                          name: 서울 메인 전산실
                        rack:
                          id: rack-a02
                          label: A-02
                        server:
                          id: srv-005
                          name: Web 02
                          status: critical
                        type: serverFault
                        severity: critical
                        status: open
                        detectedAt: '2026-07-28T01:56:00Z'
                        durationSeconds: 1085
                        acknowledgedAt: null
                        assignee: null
                        summary: CPU 온도 임계치 초과
                        version: 3
                        updatedAt: '2026-07-28T02:12:00Z'
                    meta:
                      requestId: req_incidents_01
                      generatedAt: '2026-07-28T02:14:05Z'
                      page: 1
                      pageSize: 20
                      totalItems: 1
                      totalPages: 1
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /data-centers/{dataCenterId}/assets/search:
    get:
      tags: [Assets]
      operationId: searchDataCenterAssets
      summary: 전산실 자산 검색
      description: |
        서버명/IP/시리얼과 랙 ID/라벨을 검색한다. 사용자 권한과 query에 의존하므로
        Cache-Control: no-store이며 ETag/304를 사용하지 않는다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DataCenterId'
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: types
          in: query
          description: CSV. 생략하면 rack과 server 모두.
          style: form
          explode: false
          schema:
            type: array
            uniqueItems: true
            items:
              $ref: '#/components/schemas/AssetType'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: 관련도 순 검색 결과
          headers:
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetSearchResponse'
              examples:
                default:
                  value:
                    data:
                      - assetType: server
                        id: srv-005
                        name: Web 02
                        subtitle: 10.24.12.42 · HPE-SN-4F82P2
                        status: critical
                        rack:
                          id: rack-a02
                          label: A-02
                        matchedFields: [name, ipAddress]
                    meta:
                      requestId: req_search_01
                      generatedAt: '2026-07-28T02:14:05Z'
                      limit: 10
                      returnedItems: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /servers/{serverId}:
    get:
      tags: [Servers]
      operationId: getServer
      summary: 서버 상세 조회
      description: 자산 정보, 최신 telemetry, 최근 활동과 활성 장애 참조를 반환한다.
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ServerId'
        - name: activityLimit
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 50
            default: 10
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 서버 상세
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerDetailResponse'
              examples:
                online:
                  value:
                    data:
                      id: srv-005
                      name: Web 02
                      role: Web Frontend
                      modelCode: hpe-proliant-dl360-gen11
                      modelName: HPE ProLiant DL360 Gen11
                      serialNumber: HPE-SN-4F82P2
                      ipAddress: 10.24.12.42
                      operatingSystem: Ubuntu Server 22.04 LTS
                      status: critical
                      dataCenter:
                        id: seoul-main
                        code: SEL-01
                        name: 서울 메인 전산실
                      rack:
                        id: rack-a02
                        label: A-02
                        startU: 3
                        units: 1
                      telemetry:
                        cpuPercent: 96
                        memoryPercent: 88
                        storagePercent: 72
                        temperatureCelsius: 72
                        powerWatts: 238
                        networkMbps: 1260
                        uptimeSeconds: 8040
                        collectedAt: '2026-07-28T02:14:01Z'
                        dataAgeSeconds: 4
                        stale: false
                      activities:
                        - id: act-1024
                          occurredAt: '2026-07-28T02:14:00Z'
                          message: CPU temperature exceeded threshold
                          tone: critical
                      activeIncidentIds: [inc-20260728-005]
                      updatedAt: '2026-07-28T02:14:01Z'
                    meta:
                      requestId: req_server_01
                      generatedAt: '2026-07-28T02:14:05Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /incidents/{incidentId}:
    get:
      tags: [Incidents]
      operationId: getIncident
      summary: 장애 상세 조회
      x-required-scopes: [rack3d:read]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 장애 상세
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IncidentDetailResponse'
              examples:
                default:
                  $ref: '#/components/examples/IncidentDetailResponseExample'
        '304':
          $ref: '#/components/responses/NotModified'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Incidents]
      operationId: updateIncident
      summary: 장애 처리 정보 수정
      description: |
        확인 상태, 담당자, 메모만 수정한다. resolved 전환은 원천 시스템만 가능하다.
        마지막 상세 응답 ETag를 If-Match로 보내야 한다.
      x-required-scopes: [rack3d:incident:write]
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IncidentId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/IncidentPatch'
            examples:
              acknowledge:
                value:
                  status: acknowledged
                  assignee: NOC L1
                  note: 관리 네트워크와 전원 피드를 확인 중입니다.
      responses:
        '200':
          description: 수정된 전체 장애. 새 ETag를 반환한다.
          headers:
            ETag:
