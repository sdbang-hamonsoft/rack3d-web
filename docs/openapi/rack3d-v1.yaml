components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: OAuth2/OIDC access token. 작업별 scope는 x-required-scopes 참고.
    refreshCookie:
      type: apiKey
      in: cookie
      name: rack3d_refresh
      description: HttpOnly, Secure, SameSite=Lax/Strict opaque refresh token cookie.

  parameters:
    DataCenterId:
      name: dataCenterId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: seoul-main
    ServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: srv-005
    IncidentId:
      name: incidentId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
      example: inc-20260728-005
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      schema:
        type: string
      description: 마지막 GET 응답의 ETag.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
      description: 마지막 장애 상세 응답의 ETag.

  headers:
    ETag:
      description: representation 버전 식별자.
      schema:
        type: string
      example: '"incident-inc-20260728-005-v3"'
    RefreshSetCookie:
      description: |
        회전된 refresh token. 예:
        rack3d_refresh=<opaque>; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=2592000
      schema:
        type: string
    ClearRefreshCookie:
      description: |
        refresh cookie 삭제. 예:
        rack3d_refresh=; Path=/api/v1/auth; HttpOnly; Secure; SameSite=Lax; Max-Age=0
      schema:
        type: string
    NoStore:
      description: 인증 또는 사용자/query 의존 응답 저장 금지.
      schema:
        type: string
        const: no-store

  responses:
    NotModified:
      description: ETag 기준 변경 없음. body 없음.
    BadRequest:
      description: 요청 값 검증 실패
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: https://api.example.com/problems/validation-error
                title: 요청 값이 올바르지 않습니다.
                status: 400
                code: VALIDATION_ERROR
                detail: pageSize는 1 이상 100 이하여야 합니다.
                instance: /api/rack3d/v1/data-centers?pageSize=500
                requestId: req_error_01
                errors:
                  - field: pageSize
                    code: outOfRange
                    message: 1 이상 100 이하의 정수여야 합니다.
    AuthBadRequest:
      description: 인증 요청 값 검증 실패
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              value:
                type: https://api.example.com/problems/validation-error
                title: 요청 값이 올바르지 않습니다.
                status: 400
                code: VALIDATION_ERROR
                detail: username과 password가 필요합니다.
                instance: /api/v1/auth/login
                requestId: req_login_validation_01
    Unauthorized:
      $ref: '#/components/responses/Problem401'
    Forbidden:
      $ref: '#/components/responses/Problem403'
    NotFound:
      $ref: '#/components/responses/Problem404'
    Conflict:
      $ref: '#/components/responses/Problem409'
    PreconditionFailed:
      $ref: '#/components/responses/Problem412'
    UnsupportedMediaType:
      $ref: '#/components/responses/Problem415'
    PreconditionRequired:
      $ref: '#/components/responses/Problem428'
    InvalidCredentials:
      description: 사용자명 또는 비밀번호 불일치
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://api.example.com/problems/invalid-credentials
                title: 로그인할 수 없습니다.
                status: 401
                detail: 사용자명 또는 비밀번호를 확인하세요.
                code: INVALID_CREDENTIALS
                requestId: req_login_error_01
    RefreshUnauthorized:
      description: refresh token 없음, 만료, 폐기 또는 재사용
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            invalid:
              value:
                type: https://api.example.com/problems/refresh-token-invalid
                title: 세션을 갱신할 수 없습니다.
                status: 401
                code: REFRESH_TOKEN_INVALID
                requestId: req_refresh_error_01
            reused:
              value:
                type: https://api.example.com/problems/refresh-token-reused
                title: 세션 보안 오류가 감지되었습니다.
                status: 401
                detail: 다시 로그인하세요.
                code: REFRESH_TOKEN_REUSED
                requestId: req_refresh_reuse_01
    TooManyRequests:
      description: 인증 시도 제한 초과
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
        Retry-After:
          description: 다시 시도할 수 있을 때까지의 초.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://api.example.com/problems/rate-limit
                title: 요청이 너무 많습니다.
                status: 429
                detail: 잠시 후 다시 시도하세요.
                code: RATE_LIMITED
                requestId: req_rate_limit_01
    Problem401:
      description: access token 만료 또는 유효하지 않음
      headers:
        Cache-Control:
          $ref: '#/components/headers/NoStore'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            expired:
              value:
                type: https://api.example.com/problems/token-expired
                title: 인증 토큰이 만료되었습니다.
                status: 401
                code: TOKEN_EXPIRED
                requestId: req_token_expired_01
            invalid:
              value:
                type: https://api.example.com/problems/token-invalid
                title: 인증 토큰이 유효하지 않습니다.
                status: 401
                code: TOKEN_INVALID
                requestId: req_token_invalid_01
    Problem403:
      description: 권한 부족
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            default:
              value:
                type: https://api.example.com/problems/permission-denied
                title: 요청을 수행할 권한이 없습니다.
                status: 403
                code: PERMISSION_DENIED
                requestId: req_permission_01
    Problem404:
      description: 리소스가 없거나 접근할 수 없음
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: 현재 리소스 상태와 요청이 충돌함
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: If-Match ETag가 현재 버전과 다름
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem415:
      description: 지원하지 않는 Content-Type
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem428:
      description: If-Match 헤더가 필요함
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    User:
      type: object
      additionalProperties: false
      required: [id, username, displayName, roles, permissions]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 100
        password:
          type: string
          minLength: 1
          maxLength: 256
          format: password
          writeOnly: true
    AuthSession:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresInSeconds, user]
      properties:
        accessToken:
          type: string
          readOnly: true
        tokenType:
          type: string
          const: Bearer
        expiresInSeconds:
          type: integer
          minimum: 1
          example: 900
        user:
          $ref: '#/components/schemas/User'
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthSession'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CurrentUserResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    DataCenterStatus:
      type: string
      enum: [operational, attention]
    ServerStatus:
      type: string
      enum: [healthy, warning, critical, offline]
    ServerModelCode:
      type: string
      enum:
        - dell-poweredge-r760
        - hpe-proliant-dl360-gen11
        - cisco-ucs-c240-m7
    IncidentSeverity:
      type: string
      enum: [warning, offline, critical]
    IncidentStatus:
      type: string
      enum: [open, acknowledged, resolved]
    WritableIncidentStatus:
      type: string
      enum: [open, acknowledged]
    IncidentType:
      type: string
      enum: [healthWarning, serverFault, connectionLost]
    ActivityTone:
      type: string
      enum: [normal, warning, critical]
    AssetType:
      type: string
      enum: [rack, server]

    ResponseMeta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt]
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [requestId, generatedAt, page, pageSize, totalItems, totalPages]
      properties:
        requestId:
          type: string
        generatedAt:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
    ProblemFieldError:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ErrorCode:
      type: string
      description: 클라이언트 분기에 사용하는 안정적인 대문자 snake case 오류 코드.
      enum:
        - VALIDATION_ERROR
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - INVALID_CREDENTIALS
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - PERMISSION_DENIED
        - NOT_FOUND
        - CONFLICT
        - PRECONDITION_FAILED
        - UNSUPPORTED_MEDIA_TYPE
        - PRECONDITION_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'

    DataCenterRef:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
    RackRef:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
    ServerRef:
      type: object
      additionalProperties: false
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: '#/components/schemas/ServerStatus'
    StatusCounts:
      type: object
      additionalProperties: false
      required: [healthy, warning, critical, offline]
      properties:
        healthy:
          type: integer
          minimum: 0
        warning:
          type: integer
          minimum: 0
        critical:
          type: integer
          minimum: 0
        offline:
          type: integer
          minimum: 0
    ModelCounts:
      type: object
      additionalProperties: false
      required:
        - dell-poweredge-r760
        - hpe-proliant-dl360-gen11
        - cisco-ucs-c240-m7
      properties:
        dell-poweredge-r760:
          type: integer
          minimum: 0
        hpe-proliant-dl360-gen11:
          type: integer
          minimum: 0
        cisco-ucs-c240-m7:
          type: integer
          minimum: 0

    DataCenterSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - code
        - name
        - location
        - description
        - status
        - rackCount
        - serverCount
        - activeIncidentCount
        - averageAmbientTemperatureCelsius
        - telemetryCollectedAt
        - telemetryStale
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        location:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/DataCenterStatus'
        rackCount:
          type: integer
          minimum: 0
        serverCount:
          type: integer
          minimum: 0
        activeIncidentCount:
          type: integer
          minimum: 0
        averageAmbientTemperatureCelsius:
          type: [number, 'null']
        telemetryCollectedAt:
          type: [string, 'null']
          format: date-time
        telemetryStale:
          type: boolean
    DataCenterListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DataCenterSummary'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    SceneGrid:
      type: object
      additionalProperties: false
      description: |
        (gridX, gridZ)=(0, 0)은 첫 타일 중심이다. +X는 column 증가 방향,
        +Z는 row 증가 방향이며 world 좌표는 각 index에 tileSizeMeters를 곱한다.
      required: [columns, rows, tileSizeMeters]
      properties:
        columns:
          type: integer
          minimum: 1
        rows:
          type: integer
          minimum: 1
        tileSizeMeters:
          type: number
          exclusiveMinimum: 0
    SceneServer:
      type: object
      additionalProperties: false
      required: [id, name, modelCode, startU, units, status]
      properties:
        id:
          type: string
        name:
          type: string
        modelCode:
          $ref: '#/components/schemas/ServerModelCode'
        startU:
          type: integer
          minimum: 1
        units:
          type: integer
          enum: [1, 2]
        status:
          $ref: '#/components/schemas/ServerStatus'
    RackSummary:
      type: object
      additionalProperties: false
      required:
        - serverCount
        - usedUnits
        - availableUnits
        - occupancyPercent
        - activeIncidentCount
        - statusCounts
      properties:
        serverCount:
          type: integer
          minimum: 0
        usedUnits:
          type: integer
          minimum: 0
        availableUnits:
          type: integer
          minimum: 0
        occupancyPercent:
          type: number
          minimum: 0
          maximum: 100
        activeIncidentCount:
          type: integer
          minimum: 0
        statusCounts:
          $ref: '#/components/schemas/StatusCounts'
    SceneRack:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - totalUnits
        - gridX
        - gridZ
        - rotationDegrees
        - summary
        - servers
      properties:
        id:
          type: string
        label:
          type: string
        totalUnits:
          type: integer
          minimum: 1
          maximum: 60
        gridX:
          type: integer
          minimum: 0
        gridZ:
          type: integer
          minimum: 0
        rotationDegrees:
          type: number
          minimum: 0
          exclusiveMaximum: 360
          description: 랙 바닥면 중심 pivot 기준 Y축 회전. 0° front=+Z, 90° front=+X.
        summary:
          $ref: '#/components/schemas/RackSummary'
        servers:
          type: array
          description: |
            해당 랙에 설치된 전체 서버 목록. 부분 목록이 아니며 길이는
            summary.serverCount, 상태별 개수는 summary.statusCounts와 일치해야 한다.
          items:
            $ref: '#/components/schemas/SceneServer'
    Scene:
      type: object
      additionalProperties: false
      required:
        - dataCenter
        - rackCount
        - sceneVersion
        - inventoryCollectedAt
        - inventoryStale
        - grid
        - racks
      properties:
        dataCenter:
          $ref: '#/components/schemas/DataCenterRef'
        rackCount:
          type: integer
          minimum: 0
          description: racks 배열 길이 및 전산실 목록의 rackCount와 일치한다.
        sceneVersion:
          type: integer
          minimum: 1
        inventoryCollectedAt:
          type: [string, 'null']
          format: date-time
        inventoryStale:
          type: boolean
        grid:
          $ref: '#/components/schemas/SceneGrid'
        racks:
          type: array
          description: |
            pagination 없는 해당 dataCenter의 전체 랙 목록. 실제 wire 응답에서
            배열 길이는 rackCount와 정확히 일치한다.
          items:
            $ref: '#/components/schemas/SceneRack'
    SceneResponse:
      $ref: '#/components/schemas/SingleSceneEnvelope'
    SingleSceneEnvelope:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Scene'
        meta:
          $ref: '#/components/schemas/ResponseMeta'

    CapacitySummary:
      type: object
      additionalProperties: false
      required: [totalUnits, usedUnits, availableUnits, occupancyPercent]
      properties:
        totalUnits:
          type: integer
          minimum: 0
        usedUnits:
          type: integer
          minimum: 0
        availableUnits:
          type: integer
          minimum: 0
        occupancyPercent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
    ServerFleetSummary:
      type: object
      additionalProperties: false
      required: [totalCount, healthyPercent, statusCounts, modelCounts]
      properties:
        totalCount:
          type: integer
          minimum: 0
        healthyPercent:
          type: [number, 'null']
          minimum: 0
          maximum: 100
        statusCounts:
          $ref: '#/components/schemas/StatusCounts'
        modelCounts:
          $ref: '#/components/schemas/ModelCounts'
    TemperatureHistoryPoint:
      type: object
      additionalProperties: false
      required: [bucketAt, roomAverageCelsius, rackCelsius, sampleCount]
      properties:
        bucketAt:
          type: string
          format: date-time
        roomAverageCelsius:
          type: [number, 'null']
        rackCelsius:
          type: object
          description: |
            rackId를 key로 하는 환경 온도. key 집합은 같은 snapshot의 scene rack ID 집합과
            일치하며 미수집 랙도 생략하지 않고 null로 반환한다.
          additionalProperties:
            type: [number, 'null']
        sampleCount:
          type: integer
          minimum: 0
    RackMetric:
      type: object
      additionalProperties: false
      required:
        - rackId
        - rackLabel
        - serverCount
        - usedUnits
        - availableUnits
        - largestFreeBlockUnits
        - occupancyPercent
        - activeIncidentCount
        - maxServerTemperatureCelsius
        - powerWatts
        - networkMbps
        - incidentDensityPercent
        - telemetrySampleCount
        - telemetryCollectedAt
        - telemetryStale
      properties:
        rackId:
          type: string
        rackLabel:
          type: string
        serverCount:
          type: integer
          minimum: 0
        usedUnits:
          type: integer
          minimum: 0
        availableUnits:
