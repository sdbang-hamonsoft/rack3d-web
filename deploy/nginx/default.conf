# rack3d 정적 SPA 서빙 설정.
#
# 배포 형태(D4): FMS 프론트 nginx가 `location /rack3d/`로 이 컨테이너를 프록시한다.
# 프록시가 접두사를 벗기는 구성(`proxy_pass http://rack3d-web/;`)이면 여기 `/`로 들어오고,
# 접두사를 유지하는 구성이면 `/rack3d/`로 들어온다. **두 경우 모두 동작하도록** 처리한다.
# 번들의 자산 URL은 vite `base: '/rack3d/'`가 붙여 준다.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 버전 노출 금지.
    server_tokens off;
    # 리다이렉트를 상대 경로로 낸다 — 프록시 뒤에서 절대 URL을 만들면 오리진의 http/포트가 새어
    # 나가 https 배포에서 스킴이 어긋난다.
    absolute_redirect off;

    # 접두사가 유지된 요청을 벗겨 아래 규칙을 그대로 재사용한다.
    # `^~`로 정규식 location(정적 자산 캐시 블록)보다 먼저 잡은 뒤 `last`로 재매칭시킨다.
    location = /rack3d {
        include /etc/nginx/snippets/rack3d-security-headers.conf;
        return 301 /rack3d/;
    }
    location ^~ /rack3d/ {
        rewrite ^/rack3d/(.*)$ /$1 last;
    }

    # 정적 자산 — 길게 캐시한다.
    #
    # ⚠️ **이 블록에 걸리는 파일은 URL이 바뀌어야만 갱신된다.** max-age 안에서는 브라우저가
    # 재검증조차 하지 않기 때문이다. 번들 JS·CSS는 vite가 파일명에 해시를 넣어 자동으로
    # 안전하고, `public/` 의 GLB는 코드에서 `?v=${MODEL_VERSION}`을 붙여 수동으로 무효화한다
    # (`src/App.tsx`). **`public/`에 새 파일을 놓을 때는 무효화 수단을 같이 정할 것** —
    # 안 정하면 "새로 배포했는데 옛 파일이 나온다"가 6개월 뒤에 원인 불명으로 나타난다.
    #
    # `expires 6M`(→ `Cache-Control: max-age=...` + `Expires:`)와 `add_header Cache-Control "public"`을
    # 함께 쓰면 응답에 `Cache-Control`이 **두 줄** 나갔다(실측). 동작은 같지만 헤더를 읽는 사람이
    # 어느 쪽이 유효한지 매번 따져야 해서 한 줄로 합친다.
    # `immutable`은 붙이지 않는다 — 버전 파라미터가 없는 URL(로고·파비콘)에서는 교체 후에도
    # 옛 바이트가 고정된다(FMS와 §11-15에서 같은 함정을 정리했다).
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|glb|gltf|bin)$ {
        access_log off;
        add_header Cache-Control "public, max-age=15552000";
        include /etc/nginx/snippets/rack3d-security-headers.conf;
    }

    # SPA 엔트리 — 새 배포가 바로 반영되도록 항상 재검증한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/rack3d-security-headers.conf;
    }
}
