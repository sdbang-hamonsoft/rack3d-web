# rack3d 정적 SPA 서빙 설정.
#
# 배포 형태(D4): FMS 프론트 nginx가 `location /rack3d/`로 이 컨테이너를 프록시한다.
# 프록시가 접두사를 벗기는 구성(`proxy_pass http://rack3d-web/;`)이면 여기 `/`로 들어오고,
# 접두사를 유지하는 구성이면 `/rack3d/`로 들어온다. **두 경우 모두 동작하도록** 처리한다.
# 번들의 자산 URL은 vite `base: '/rack3d/'`가 붙여 준다.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # nginx 버전 노출 금지.
    server_tokens off;
    # 리다이렉트를 상대 경로로 낸다 — 프록시 뒤에서 절대 URL을 만들면 오리진의 http/포트가 새어
    # 나가 https 배포에서 스킴이 어긋난다.
    absolute_redirect off;

    # 접두사가 유지된 요청을 벗겨 아래 규칙을 그대로 재사용한다.
    # `^~`로 정규식 location(정적 자산 캐시 블록)보다 먼저 잡은 뒤 `last`로 재매칭시킨다.
    location = /rack3d {
        include /etc/nginx/snippets/rack3d-security-headers.conf;
        return 301 /rack3d/;
    }
    location ^~ /rack3d/ {
        rewrite ^/rack3d/(.*)$ /$1 last;
    }

    # 파일명 해시가 붙는 정적 자산 — 길게 캐시한다.
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|glb|gltf|bin)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
        include /etc/nginx/snippets/rack3d-security-headers.conf;
    }

    # SPA 엔트리 — 새 배포가 바로 반영되도록 항상 재검증한다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/rack3d-security-headers.conf;
    }
}
