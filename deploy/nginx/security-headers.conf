# ============================================================================
# rack3d 공통 보안 응답 헤더.
# ============================================================================
# ⚠️ nginx의 add_header는 상속되지 않는다 — 자기 블록에 add_header가 하나라도 있으면
#    상위(server) 블록의 add_header 전체가 무시된다. 그래서 개별 location마다 이 파일을
#    include 해야 한다. 이 파일이 헤더 목록의 SSOT다.
#
# 운영 배포(D4)에서는 FMS 프론트 nginx의 `location /rack3d/`가 자기 스니펫
# (netis-fms/deploy/docker/frontend/security-headers.conf)을 함께 얹는다. 두 정책이
# 겹쳐도 브라우저는 더 엄격한 쪽을 적용하므로, 여기서는 **FMS 정책과 같은 내용**을 유지한다
# — 어긋나면 운영에서만 화면이 깨진다(R4).
# ----------------------------------------------------------------------------

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;          # CSP frame-ancestors와 동일 취지(구형 브라우저용)
add_header Referrer-Policy "same-origin" always;

# HSTS — TLS 종단은 Cloudflare이고 오리진은 http라 오리진 동작을 바꾸지는 않지만,
# 그대로 전달되므로 브라우저에는 유효하다. preload는 되돌리기가 어려워 넣지 않는다.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# 쓰지 않는 강력 권한 API 차단
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=()" always;

# ── CSP ─────────────────────────────────────────────────────────────────────
# rack3d가 실제로 쓰는 것만 허용한다:
#   script-src 'self'         : Vite 번들은 전부 외부 파일(인라인 스크립트 없음).
#                               three.js·@react-three/fiber·ECharts 모두 eval/new Function을
#                               쓰지 않아 'unsafe-eval'이 필요 없다.
#                               ⚠️ **WASM 주의**: @react-three/drei의 useGLTF는 기본값이
#                               useDraco=true·useMeshopt=true라, 그대로 두면 meshoptimizer WASM을
#                               인스턴스화하다 이 정책의 wasm-eval 금지에 걸려 3D 씬 진입마다
#                               CompileError가 난다(dev 서버는 CSP가 없어 드러나지 않는다).
#                               → rack3d는 src/App.tsx의 GLTF_USE_DRACO/GLTF_USE_MESHOPT를
#                                 false로 두어 **디코더를 아예 켜지 않는 쪽**을 택했다.
#                               압축 GLB가 필요해지면 로컬 디코더를 번들에 넣어라. 여기에
#                               'wasm-unsafe-eval'을 추가하는 것은 FMS 스니펫과 영구 동기화
#                               부담이 생기므로 마지막 수단이다.
#   style-src 'unsafe-inline' : React의 style={{...}} 속성과 ECharts의 인라인 스타일 때문에 필수.
#   img-src data: blob:       : 아이콘 data URI, 자산 이미지 텍스처(E17 fetch→blob).
#   connect-src 'self' blob:  : /api 호출, GLB·텍스처 fetch.
#   worker-src/child-src blob:: 향후 로더 워커 대비(FMS 정책과 동일하게 유지).
#   frame-ancestors 'none'    : 클릭재킹 차단.
# **외부 CDN 의존 0 방침**(C10)을 어기면 운영에서만 깨진다 — 폐쇄망 납품 전제이기도 하다.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' blob:" always;
